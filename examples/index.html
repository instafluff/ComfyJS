<html>
  <head>
    <script src="../dist/comfy.min.js"></script>
  </head>
  <body>
    <pre id="log"></pre>
    <script type="text/javascript">
      const log = (msg) => {
        console.log(msg);
        document.getElementById('log').textContent += msg + '\n';
      };
      
      ComfyJS.onError = (error) => {
        log("ERROR: " + error);
      };
      
      ComfyJS.onConnected = (address, port, isFirstConnect) => {
        log("Connected to " + address + ":" + port);
      };
      
      ComfyJS.onCommand = ( user, command, message, flags, extra ) => {
        log("COMMAND: " + user + " used !" + command + " with: " + message);
      };
      
      ComfyJS.onChat = ( user, message, flags, self, extra ) => {
        log("CHAT [self=" + self + "]: " + user + ": " + message);
      };
      
      // Pass true as 4th argument for debug mode
      ComfyJS.Init( "instafluff", null, null, true )
        .then(() => log("Init complete!"))
        .catch(err => log("Init failed: " + err));
    </script>
  </body>
</html>
